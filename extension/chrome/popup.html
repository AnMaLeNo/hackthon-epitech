<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Focus Timebox</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>Focus Timebox</h1>
      <p>Gérez vos sessions de travail</p>
    </header>

    <div class="glass-panel profile-container">
      <div class="input-group">
        <label for="user-name">Votre nom</label>
        <div class="name-input-wrapper">
          <input type="text" id="user-name" placeholder="Ex: Antoine...">
          <button type="button" id="save-name-btn" class="secondary-btn" aria-label="Sauvegarder le nom">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="glass-panel focus-mode-container">
      <div class="toggle-wrapper">
        <label for="focus-toggle" class="toggle-label">
          <span class="toggle-title">Mode Focus</span>
          <span class="toggle-desc">Surveille et bloque les distractions</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="focus-toggle">
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <div class="glass-panel form-container">
      <form id="task-form">
        <div class="input-group">
          <input type="text" id="task-name" placeholder="Ex: Réviser les maths..." required>
        </div>
        <div class="time-inputs">
          <div class="input-group">
            <label for="start-time">Début</label>
            <input type="time" id="start-time" required>
          </div>
          <div class="input-group">
            <label for="end-time">Fin</label>
            <input type="time" id="end-time" required>
          </div>
        </div>
        <button type="submit" class="primary-btn">
          <span>Ajouter la tâche</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </form>
    </div>

    <div class="tasks-container">
      <h2>Vos tâches</h2>
      <ul id="task-list">
        <!-- Tasks will be injected here via JS -->
      </ul>
      <div id="empty-state" class="empty-state">
        <p>Aucune tâche pour le moment. Ajoutez-en une pour commencer !</p>
      </div>
    </div>

    <div class="glass-panel blocklist-container">
      <h2>Sites Bloqués</h2>
      <form id="blocklist-form" class="blocklist-form">
        <input type="text" id="domain-name" placeholder="Ex: youtube.com" required>
        <button type="submit" class="secondary-btn" aria-label="Ajouter domaine">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </form>
      <ul id="blocklist-list" class="domain-list">
        <!-- Domains injected via JS -->
      </ul>
      <div id="blocklist-empty" class="empty-state">
        <p>Aucun site bloqué pour l'instant.</p>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
