
services:
  # -----------------------------------------------
  # Reverse proxy nginx — point d'entrée unique
  # Toutes les requêtes de l'extension passent ici
  # -----------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8800:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - discord-relay
      - test-server
    networks:
      - relay_network
    restart: unless-stopped

  # -----------------------------------------------
  # Service 1 : Relay Discord
  # Accessible via nginx sur POST /
  # -----------------------------------------------
  discord-relay:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: discord-relay-service
    environment:
      - PORT=8080
    restart: unless-stopped
    networks:
      - relay_network

  # -----------------------------------------------
  # Service 2 : Test server FastAPI
  # Accessible via nginx sur GET /process
  # -----------------------------------------------
  test-server:
    build:
      context: ./test-server
      dockerfile: Dockerfile
    container_name: test-server-service
    restart: unless-stopped
    networks:
      - relay_network

networks:
  relay_network:
    driver: bridge
