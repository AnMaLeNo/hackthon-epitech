version: '3.8'

services:
  discord-relay:
    build: 
      context: ./bot
      dockerfile: Dockerfile
    container_name: discord-relay-service
    ports:
      - "8842:8080"
    environment:
      # Si vous souhaitez sécuriser ou modifier le webhook sans retoucher le code, 
      # vous pouvez décommenter la ligne suivante :
      # - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...
      - PORT=8080
    restart: unless-stopped
    # Permet de regrouper le service dans un réseau spécifique si d'autres microservices sont ajoutés
    networks:
      - relay_network

networks:
  relay_network:
    driver: bridge
