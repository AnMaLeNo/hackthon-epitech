events {}

http {
    server {
        listen 80;

        # -----------------------------------------------
        # Headers CORS injectés sur TOUTES les réponses
        # L'extension n'aura plus jamais ce problème
        # -----------------------------------------------
        add_header 'Access-Control-Allow-Origin'  '*'                              always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS'             always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Content-Length'   always;

        # Répond aux requêtes OPTIONS (preflight) globalement
        if ($request_method = OPTIONS) {
            return 204;
        }

        # -----------------------------------------------
        # Route 1 : POST / → discord-relay
        # -----------------------------------------------
        location = / {
            proxy_pass         http://discord-relay:8080/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # -----------------------------------------------
        # Route 2 : GET /process → test-server
        # -----------------------------------------------
        location /process {
            proxy_pass         http://test-server:8080/process;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
